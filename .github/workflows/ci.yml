name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  WISP_REQUIRE_PROGRAMS: "1"

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is Apple Silicon: the baseline compiler runs there.
        # ubuntu-latest is x86-64: only the interpreter is available.
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
            tests/programs/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.toml', 'tests/programs/Cargo.toml') }}
      - name: unit and integration tests
        run: cargo test --release --lib --bins --test programs
      - name: spec test suite (WebAssembly/spec wg-2.0)
        run: cargo test --release --test spec
      - name: CLI smoke test
        run: |
          cargo build --release
          ./target/release/wisp run tests/programs/target/wasm32-wasip1/release/hello.wasm ci
          ./target/release/wisp run tests/programs/target/wasm32-wasip1/release/primes.wasm 100000

  fuzz:
    # Interpreter versus compiler on wasm-smith modules (short run; `make fuzz` runs more).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo run --release --manifest-path tools/fuzz-diff/Cargo.toml -- --cases 300 --seed 7000

  lint:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --release --all-targets -- -D warnings
